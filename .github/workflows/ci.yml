name: Build and smoke test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: experiment
          POSTGRES_PASSWORD: experiment
          POSTGRES_DB: experiment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U experiment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://experiment:experiment@127.0.0.1:5432/experiment?sslmode=disable
      ADMIN_KEY: ci-test-key-not-for-production
      PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Go formatting and tests
        run: |
          go mod download
          go test -mod=mod ./...
          go vet -mod=mod ./...
          test -z "$(gofmt -l *.go)"
      - name: Start server and exercise both conditions
        run: |
          go run -mod=mod . > /tmp/experiment-server.log 2>&1 &
          echo $! > /tmp/experiment.pid
          trap 'kill $(cat /tmp/experiment.pid) || true; cat /tmp/experiment-server.log' EXIT
          python3 scripts/smoke.py
