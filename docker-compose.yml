services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: experiment
      POSTGRES_PASSWORD: experiment
      POSTGRES_DB: experiment
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experiment"]
      interval: 3s
      retries: 15
volumes:
  pgdata:
